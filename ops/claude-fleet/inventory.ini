# One line per server. Replace with your real 21 hosts.
# ansible_host = the VPS's public IP
# ansible_user = the account Ansible connects as (root, or a sudo user you've already created)
# ansible_ssh_private_key_file = the key from the SSH setup we did earlier (~/.ssh/vps_fleet)

[claude_fleet]
vps1 ansible_host=203.0.113.10 ansible_user=root ansible_ssh_private_key_file=~/.ssh/vps_fleet
vps2 ansible_host=203.0.113.11 ansible_user=root ansible_ssh_private_key_file=~/.ssh/vps_fleet
vps3 ansible_host=203.0.113.12 ansible_user=root ansible_ssh_private_key_file=~/.ssh/vps_fleet
# ... add all 21 here
